version: 2

metrics:
  - name: cdm_total_gmv_euros
    label: GMV Amount Euros
    model: ref('obt_sales')
    description: The total GMV amount recorded converted in €

    calculation_method: sum
    expression: gmv_amount_euros

    timestamp: gmv_recorded_at_date
    time_grains: [day, week, month, quarter, year]

    dimensions:
      - economical_businessunit_country_code
      - economical_businessunit_id
      - economical_businessunit_name
      - economical_businessunit_gln
      - brand_name
      - customer_identification_type
      - category_label
      - retail_univers_label
      - sport_univers_label
      - retail_family_label
      - sport_family_label
      - retail_department_label
      - sport_department_label
      - retail_sub_department_label
      - sport_sub_department_label
      - product_nature_label
      - model_label
      - seller_type
